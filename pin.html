<!doctype html>
<html lang="no">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#202022" />
    <meta name="description" content="Bekreft abonnementet ditt på Century: Age of Ashes." />
    <title>Century: Age of Ashes – Bekreftelse</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="screen pin-screen" aria-label="Century: Age of Ashes – PIN-bekreftelse">
      <img class="pin-art" src="PIN.jpg" alt="PIN-kode for Century: Age of Ashes." />
      <img class="pin-logo" src="logo-century-white%201.png" alt="Century: Age of Ashes" />
      <img class="pin-hero" src="img.png" alt="Ridder fra Century: Age of Ashes" />

      <section class="pin-content" aria-labelledby="pin-title">
        <h1 id="pin-title">Bekreft abonnementet</h1>
        <p>Skriv inn PIN-koden du mottok på SMS.</p>
        <form action="homepage.html" method="get">
          <label class="sr-only" for="pin">PIN-kode</label>
          <input id="pin" name="pin" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{4}" maxlength="4" placeholder="----" required />
          <button type="submit">BEKREFT</button>
        </form>
      </section>

      <a class="pin-terms-link" href="terms.html">Vilkår</a>
    </main>
  </body>
</html>
